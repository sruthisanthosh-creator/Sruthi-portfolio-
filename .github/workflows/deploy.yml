# Builds the site and publishes it to GitHub Pages.
#
# One manual step before the first run: Settings -> Pages -> Build and
# deployment -> Source -> "GitHub Actions". Until that is set, this workflow
# builds fine but has nowhere to deploy to.
name: Deploy to Pages

on:
  push:
    branches:
      - main
      - claude/animated-3d-portfolio-5p8pao
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it; skip queued duplicates.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # .npmrc sets legacy-peer-deps, which react-three-fiber's optional Expo
      # peers need on React 19. `npm ci` honours it.
      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
