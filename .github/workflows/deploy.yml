# Builds the site and publishes it to GitHub Pages.
#
# No manual setup: configure-pages turns Pages on itself via the API the first
# time this runs (that is what `enablement` does), using the pages:write
# permission granted below.
name: Deploy to Pages

on:
  push:
    branches:
      - main
      - claude/animated-3d-portfolio-5p8pao
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it; skip queued duplicates.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # .npmrc sets legacy-peer-deps, which react-three-fiber's optional Expo
      # peers need on React 19. `npm ci` honours it.
      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # Creates the Pages site on the first run instead of failing with
          # "Get Pages site failed ... verify that the repository has Pages
          # enabled", which is what happens when it has never been turned on.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
