# Builds the site and publishes it to GitHub Pages.
#
# ONE-TIME SETUP, done by hand in the browser:
#   Settings -> Pages -> Build and deployment -> Source -> "GitHub Actions"
#
# This cannot be automated from here. Asking configure-pages to create the Pages
# site itself (enablement: true) fails with "Resource not accessible by
# integration": creating a Pages site needs administration rights that the
# workflow token does not carry, whatever `permissions` says. Enabling it in the
# browser once is the only route; every deploy after that is automatic.
name: Deploy to Pages

on:
  push:
    branches:
      - main
      - claude/animated-3d-portfolio-5p8pao
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it; skip queued duplicates.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # .npmrc sets legacy-peer-deps, which react-three-fiber's optional Expo
      # peers need on React 19. `npm ci` honours it.
      - run: npm ci

      - run: npm run build

      # Fails with "Get Pages site failed" until the one-time setup at the top
      # of this file is done.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
